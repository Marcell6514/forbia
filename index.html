<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>For Bia — A Little World</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Marcellus&family=Great+Vibes&display=swap" rel="stylesheet">

<!-- ======================= CONFIG ======================= -->
<script>
  window.SITE_CONFIG = {
    fullName: "Lia Aulia Sari",
    nickname: "Bia",
    birthDateLabel: "13 Agustus 2006",
    target: { year: 2026, month: 8, day: 13 }, // month is 1-indexed here
    password: "9913",
    colors: {
      dark: "#2a0f1c",
      deep: "#4a1330",
      blush: "#f3c9d6",
      dusty: "#c98aa0",
      rose: "#e8a3bb",
      gold: "#e6c391",
      warmWhite: "#fdf6f3"
    },
    memories: [
      { image: "images/bia1.jpg", caption: "one of my favorite memories" },
      { image: "images/bia2.jpg", caption: "that smile" },
      { image: "images/bia3.jpg", caption: "you" },
      { image: "images/bia4.jpg", caption: "another little memory" },
      { image: "images/bia5.jpg", caption: "my favorite moment" },
      { image: "images/bia6.jpg", caption: "always this" }
    ],
    mainPortrait: "images/bia-main.jpg",
    loveMessages: [
      "I LOVE YOU", "BE HAPPY", "KEEP SMILING", "YOU ARE SPECIAL",
      "MY FAVORITE PERSON", "ALWAYS BE YOU", "I'M GLAD I MET YOU",
      "YOU DESERVE THE BEST", "HAPPY BIRTHDAY", "STAY HAPPY",
      "YOU MEAN SO MUCH TO ME"
    ],
    letter: `Dear Bia,

Happy Birthday.

I made this little world for you, because sometimes words alone
don't feel like enough.

Semoga di umur yang baru ini kamu selalu sehat, dimudahkan dalam segala urusan, dan dikelilingi orang-orang yang tulus sayang sama kamu.

Semoga semua hal yang kamu usahain pelan-pelan bisa tercapai, semua yang kamu lewatin bisa bikin kamu semakin kuat, dan semoga kamu selalu punya alasan buat bahagia.

Makasih ya, untuk semua hal yang pernah kita lewatin selama ini. Aku bersyukur pernah punya kesempatan buat kenal, sayang, dan tumbuh bareng kamu.

Aku nggak mau ngasih ucapan yang terlalu banyak atau bikin kamu ngerasa terbebani. Hari ini tentang kamu, jadi aku cuma berharap kamu bisa menikmati hari kamu dan bahagia.

I hope this year brings you happiness, beautiful moments, and
many reasons to smile.

Happy 20th Birthday, Bia.

With love,
Marcell`,
    audioFile: "audio/aboutyou.mp3",
    finalLines: ["Happy Birthday, Bia.", "Lia Aulia Sari", "13 · 08 · 2026", "Made with love CELL."]
  };

  /* Global, inline-bound handlers for the password gate — attribute-based
     (onsubmit/onclick) so they work the instant the DOM exists, with zero
     dependency on addEventListener timing, external scripts, or load order. */
  window.handlePasswordSubmit = function(ev){
    if(ev && ev.preventDefault) ev.preventDefault();
    var input = document.getElementById("password-input");
    var val = (input.value || "").trim();
    if(val === window.SITE_CONFIG.password){
      window.doUnlockGate();
    } else {
      input.classList.remove("shake");
      void input.offsetWidth;
      input.classList.add("shake");
      input.value = "";
    }
    return false;
  };
  window.doUnlockGate = function(){
    if(window.__PASSWORD_OK) return;
    window.__PASSWORD_OK = true;
    if(typeof window.__unlockUI === "function"){
      window.__unlockUI();
    } else {
      var ps = document.getElementById("password-screen");
      var cs = document.getElementById("countdown-screen");
      if(ps){ ps.style.display = "none"; }
      if(cs){ cs.classList.add("active"); }
    }
  };
</script>

<style>
  :root{
    --dark:#2a0f1c; --deep:#4a1330; --blush:#f3c9d6; --dusty:#c98aa0;
    --rose:#e8a3bb; --gold:#e6c391; --warm:#fdf6f3;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; background:var(--dark); color:var(--warm);
    font-family:'Cormorant Garamond', serif; overflow-x:hidden;
    height:100%; width:100%;
  }
  ::selection{ background:var(--rose); color:var(--dark); }

  #three-canvas{
    position:fixed; inset:0; width:100vw; height:100vh; z-index:1;
    display:block;
  }

  .vignette{
    position:fixed; inset:0; z-index:2; pointer-events:none;
    background:radial-gradient(ellipse at center, rgba(0,0,0,0) 40%, rgba(20,4,12,0.55) 100%);
  }

  /* ---------- custom cursor ---------- */
  .cursor-halo, .cursor-dot{
    position:fixed; top:0; left:0; border-radius:50%; pointer-events:none;
    z-index:9999; transform:translate(-50%,-50%);
    transition:width .25s ease, height .25s ease, background .25s ease, border-color .25s ease;
  }
  .cursor-dot{
    width:6px; height:6px; background:var(--warm); box-shadow:0 0 8px 2px rgba(253,246,243,.8);
  }
  .cursor-halo{
    width:30px; height:30px; border:1px solid rgba(232,163,187,.7);
    box-shadow:0 0 20px 4px rgba(232,163,187,.25);
  }
  .cursor-halo.hover-heart{ width:54px; height:54px; border-color:var(--rose); box-shadow:0 0 30px 8px rgba(232,163,187,.45); }
  .cursor-halo.hover-soft{ width:46px; height:46px; border-color:var(--gold); }
  body.no-custom-cursor, body.no-custom-cursor *{ cursor:auto !important; }
  body.no-custom-cursor .cursor-dot, body.no-custom-cursor .cursor-halo{ display:none; }
  body:not(.no-custom-cursor){ cursor:none; }
  body:not(.no-custom-cursor) a, body:not(.no-custom-cursor) button, body:not(.no-custom-cursor) [data-cursor]{ cursor:none; }

  .trail-particle{
    position:fixed; top:0; left:0; pointer-events:none; z-index:9998;
    border-radius:50%; opacity:.9; will-change:transform,opacity;
  }
  .burst-heart{
    position:fixed; top:0; left:0; pointer-events:none; z-index:9998; font-size:14px;
    color:var(--rose); will-change:transform,opacity;
  }

  /* ---------- shared overlay layer ---------- */
  .overlay{
    position:fixed; inset:0; z-index:20;
    display:flex; align-items:center; justify-content:center;
    flex-direction:column; text-align:center; padding:24px;
  }

  /* ---------- password gate ---------- */
  #password-screen{
    background:radial-gradient(ellipse at 50% 30%, rgba(74,19,48,.55), rgba(20,4,10,.92) 75%);
    transition:opacity 1.4s ease;
  }
  .eyebrow{
    font-family:'Marcellus', serif; letter-spacing:.35em; text-transform:uppercase;
    font-size:12px; color:var(--blush); opacity:.85; margin-bottom:18px;
  }
  .headline{
    font-size:clamp(22px,4vw,34px); font-weight:500; color:var(--warm); margin:0 0 34px;
    letter-spacing:.02em;
  }
  #password-form{ display:flex; flex-direction:column; align-items:center; gap:16px; }
  #password-input{
    background:transparent; border:none; border-bottom:1px solid rgba(253,246,243,.4);
    color:var(--warm); font-family:'Marcellus',serif; font-size:26px; letter-spacing:.6em;
    text-align:center; width:220px; padding:10px 0; outline:none;
  }
  #password-input:focus{ border-bottom-color:var(--rose); }
  #password-input.shake{ animation:shakeIt .45s; border-bottom-color:#e37d92; }
  @keyframes shakeIt{
    0%,100%{ transform:translateX(0); } 20%{ transform:translateX(-10px); }
    40%{ transform:translateX(9px); } 60%{ transform:translateX(-6px); } 80%{ transform:translateX(4px); }
  }
  .enter-btn{
    margin-top:6px; background:transparent; border:1px solid var(--rose); color:var(--warm);
    padding:9px 26px; border-radius:30px; font-family:'Marcellus',serif; font-size:12px;
    letter-spacing:.2em; text-transform:uppercase; transition:all .3s ease;
  }
  .enter-btn:hover{ background:rgba(232,163,187,.18); box-shadow:0 0 20px rgba(232,163,187,.3); }
  .granted{
    font-family:'Marcellus',serif; letter-spacing:.3em; text-transform:uppercase;
    font-size:13px; color:var(--gold); margin-top:22px; opacity:0; transition:opacity .8s ease;
  }
  .granted.show{ opacity:1; }

  /* ---------- countdown ---------- */
  #countdown-screen{ opacity:0; pointer-events:none; transition:opacity 1.2s ease; }
  #countdown-screen.active{ opacity:1; pointer-events:all; }
  .cd-sub{ font-size:16px; color:var(--blush); opacity:.85; margin-bottom:26px; font-style:italic; }
  .cd-grid{ display:flex; gap:clamp(14px,3vw,34px); }
  .cd-unit{ display:flex; flex-direction:column; align-items:center; min-width:64px; }
  .cd-num{
    font-family:'Marcellus',serif; font-size:clamp(30px,6vw,54px); color:var(--warm);
    text-shadow:0 0 20px rgba(232,163,187,.5);
  }
  .cd-label{ font-size:11px; letter-spacing:.25em; text-transform:uppercase; color:var(--dusty); margin-top:6px; }

  /* ---------- intro cue over heart ---------- */
  #intro-cue{
    position:fixed; left:0; right:0; bottom:6vh; z-index:15; text-align:center;
    opacity:0; transition:opacity 1.4s ease; pointer-events:none;
  }
  #intro-cue.show{ opacity:1; }
  #intro-cue .for-someone{ font-family:'Great Vibes', cursive; font-size:30px; color:var(--warm); margin-bottom:10px; }
  #intro-cue .scroll-cta{ font-size:12px; letter-spacing:.3em; text-transform:uppercase; color:var(--blush); }
  .scroll-arrow{ margin-top:10px; font-size:16px; animation:bob 2s ease-in-out infinite; }
  @keyframes bob{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(8px);} }

  /* ---------- scroll spacer / story ---------- */
  #story{ position:relative; z-index:10; width:100%; }
  .act{ position:relative; height:100vh; }
  #act-heart{ height:130vh; }
  #act-memories{ height:420vh; }
  #act-envelope{ height:140vh; }
  #act-letter{ height:180vh; }
  #act-universe{ height:260vh; }
  #act-final{ height:160vh; }

  .caption-tag{
    position:absolute; z-index:16; font-family:'Great Vibes',cursive; font-size:26px;
    color:var(--warm); opacity:0; transition:opacity .5s ease; text-shadow:0 0 12px rgba(0,0,0,.4);
    pointer-events:none;
  }

  /* ---------- letter overlay ---------- */
  #letter-wrap{
    position:fixed; inset:0; z-index:18; display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity .9s ease;
  }
  #letter-wrap.show{ opacity:1; pointer-events:all; }
  .letter-paper{
    width:min(560px,88vw); max-height:78vh; overflow-y:auto;
    background:linear-gradient(180deg, #fffaf7, #fdf1ee);
    border:1px solid rgba(201,138,160,.5); border-radius:4px;
    box-shadow:0 30px 80px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.4) inset;
    padding:clamp(26px,5vw,52px); color:#5a2438; position:relative;
  }
  .letter-paper::before{
    content:"❀"; position:absolute; top:18px; right:22px; color:var(--dusty); font-size:20px; opacity:.6;
  }
  .letter-dear{ font-family:'Great Vibes', cursive; font-size:34px; color:#8a2c4c; margin:0 0 18px; }
  .letter-body{ font-size:18px; line-height:1.8; white-space:pre-wrap; font-weight:500; }
  .letter-scroll-hint{ text-align:center; margin-top:16px; font-size:11px; letter-spacing:.2em; color:#a56; text-transform:uppercase; opacity:.7; }
  .letter-close{
    position:absolute; top:12px; right:14px; width:30px; height:30px; border-radius:50%;
    border:1px solid rgba(138,44,76,.35); background:rgba(255,255,255,.5); color:#8a2c4c;
    font-size:15px; line-height:1; display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:all .2s ease; z-index:2;
  }
  .letter-close:hover{ background:#8a2c4c; color:#fff8f5; transform:scale(1.06); }

  /* ---------- final overlay ---------- */
  #final-wrap{
    position:fixed; inset:0; z-index:18; display:flex; flex-direction:column;
    align-items:center; justify-content:center; opacity:0; transition:opacity 1.6s ease; pointer-events:none;
  }
  #final-wrap.show{ opacity:1; }
  .final-line{
    opacity:0; transform:translateY(14px); transition:opacity 1s ease, transform 1s ease;
    margin:6px 0;
  }
  .final-line.reveal{ opacity:1; transform:translateY(0); }
  .final-line:nth-child(1){ font-family:'Great Vibes',cursive; font-size:clamp(30px,5.6vw,52px); color:var(--warm); }
  .final-line:nth-child(2){ font-family:'Marcellus',serif; font-size:clamp(16px,2.4vw,22px); letter-spacing:.25em; text-transform:uppercase; color:var(--blush); }
  .final-line:nth-child(3){ font-family:'Marcellus',serif; font-size:14px; letter-spacing:.3em; color:var(--gold); }
  .final-line:nth-child(4){ font-family:'Cormorant Garamond',serif; font-style:italic; font-size:15px; color:rgba(253,246,243,.7); }

  /* ---------- music control ---------- */
  #music-btn{
    position:fixed; bottom:22px; right:22px; z-index:60; width:42px; height:42px; border-radius:50%;
    border:1px solid rgba(253,246,243,.4); background:rgba(42,15,28,.5); backdrop-filter:blur(6px);
    color:var(--warm); font-size:16px; display:flex; align-items:center; justify-content:center;
    opacity:0; transition:opacity .8s ease, transform .3s ease;
  }
  #music-btn.show{ opacity:1; }
  #music-btn:hover{ transform:scale(1.08); }

  /* ---------- progress rail (subtle) ---------- */
  #rail{
    position:fixed; right:16px; top:50%; transform:translateY(-50%); z-index:19;
    width:2px; height:120px; background:rgba(253,246,243,.15); border-radius:2px; overflow:hidden;
    opacity:0; transition:opacity .8s ease;
  }
  #rail.show{ opacity:1; }
  #rail-fill{ width:100%; background:linear-gradient(180deg,var(--rose),var(--gold)); height:0%; }

  @media (max-width:720px){
    .letter-body{ font-size:16px; }
    .cd-grid{ gap:12px; }
    #rail{ display:none; }
  }
  /* ---------- responsive layout: phone + tablet ---------- */
  /* ---------- touch / mobile stability ---------- */
  @media (pointer:coarse){
    html, body{
      touch-action:pan-y;
      overscroll-behavior-x:none;
      -webkit-text-size-adjust:100%;
    }
    #three-canvas{
      width:100%;
      height:100dvh;
      touch-action:none;
    }
    button, input, a, [data-cursor]{
      touch-action:manipulation;
      -webkit-tap-highlight-color:transparent;
    }
    .overlay{
      min-height:100dvh;
      height:100dvh;
    }
    .letter-paper{
      overscroll-behavior:contain;
      -webkit-overflow-scrolling:touch;
      touch-action:pan-y;
    }
  }

  @media (max-width:1024px){
    .overlay{
      padding:clamp(18px,4vw,32px);
    }
    .headline{
      font-size:clamp(22px,4.5vw,32px);
      margin-bottom:clamp(24px,4vw,34px);
    }
    #password-input{
      width:min(220px,62vw);
      font-size:24px;
    }
    .cd-grid{
      gap:clamp(10px,3vw,24px);
    }
    .cd-unit{
      min-width:clamp(54px,12vw,70px);
    }
    .cd-num{
      font-size:clamp(28px,7vw,50px);
    }
    .letter-paper{
      width:min(680px,90vw);
      max-height:80svh;
      padding:clamp(24px,5vw,46px);
    }
    .letter-body{
      font-size:clamp(16px,2.3vw,18px);
      line-height:1.75;
    }
    #music-btn{
      right:max(14px, env(safe-area-inset-right));
      bottom:max(14px, env(safe-area-inset-bottom));
    }
  }

  @media (max-width:720px){
    html,body{
      min-height:100%;
      -webkit-text-size-adjust:100%;
      overscroll-behavior-x:none;
    }
    .overlay{
      padding:20px 18px;
      min-height:100svh;
    }
    .eyebrow{
      font-size:10px;
      letter-spacing:.24em;
      margin-bottom:14px;
    }
    .headline{
      font-size:clamp(21px,7vw,29px);
      margin-bottom:24px;
    }
    #password-form{
      gap:14px;
    }
    #password-input{
      width:min(210px,68vw);
      font-size:22px;
      letter-spacing:.5em;
      padding:9px 0;
    }
    .enter-btn{
      padding:10px 24px;
      min-height:42px;
    }
    #countdown-screen .cd-sub{
      font-size:15px;
      margin-bottom:22px;
      max-width:290px;
    }
    #countdown-screen .cd-grid{
      width:100%;
      justify-content:center;
      gap:clamp(6px,3vw,14px);
    }
    #countdown-screen .cd-unit{
      min-width:clamp(48px,18vw,66px);
    }
    #countdown-screen .cd-num{
      font-size:clamp(25px,9vw,40px);
    }
    .cd-label{
      font-size:9px;
      letter-spacing:.16em;
      margin-top:4px;
    }
    #intro-cue{
      bottom:max(5vh, calc(env(safe-area-inset-bottom) + 28px));
      padding:0 18px;
    }
    #intro-cue .for-someone{
      font-size:27px;
    }
    #intro-cue .scroll-cta{
      font-size:10px;
      letter-spacing:.22em;
    }
    .letter-paper{
      width:calc(100vw - 28px);
      max-height:82svh;
      border-radius:8px;
      padding:34px 20px 24px;
    }
    .letter-dear{
      font-size:30px;
      margin-bottom:14px;
    }
    .letter-body{
      font-size:16px;
      line-height:1.7;
    }
    .letter-scroll-hint{
      font-size:9px;
      letter-spacing:.14em;
    }
    .letter-close{
      top:9px;
      right:9px;
      width:32px;
      height:32px;
    }
    .final-line:nth-child(2){
      font-size:clamp(14px,4vw,19px);
      letter-spacing:.16em;
    }
    .final-line:nth-child(3){
      font-size:11px;
      letter-spacing:.2em;
    }
    .final-line:nth-child(4){
      font-size:13px;
      padding:0 18px;
      text-align:center;
    }
  }

  @media (max-width:420px){
    #countdown-screen .cd-grid{
      gap:4px;
    }
    #countdown-screen .cd-unit{
      min-width:45px;
    }
    #countdown-screen .cd-num{
      font-size:25px;
    }
    .cd-label{
      font-size:8px;
      letter-spacing:.1em;
    }
    .letter-paper{
      width:calc(100vw - 20px);
      max-height:84svh;
      padding-left:17px;
      padding-right:17px;
    }
    .letter-body{
      font-size:15.5px;
    }
  }

</style>
</head>
<body>

<canvas id="three-canvas"></canvas>
<div class="vignette"></div>

<!-- custom cursor -->
<div class="cursor-dot" id="cursorDot"></div>
<div class="cursor-halo" id="cursorHalo"></div>

<!-- PASSWORD -->
<div class="overlay" id="password-screen">
  <div class="eyebrow">A little surprise awaits you</div>
  <div class="headline">Enter the password</div>
  <form id="password-form" autocomplete="off" onsubmit="return window.handlePasswordSubmit(event)">
    <input id="password-input" type="password" inputmode="numeric" maxlength="8" data-cursor="soft" />
    <button type="submit" class="enter-btn" data-cursor="soft">Enter</button>
  </form>
  <div class="granted" id="granted-text">Access granted.</div>
</div>

<!-- COUNTDOWN -->
<div class="overlay" id="countdown-screen">
  <div class="eyebrow">For Bia</div>
  <div class="cd-sub">Something special is almost here.</div>
  <div class="cd-grid">
    <div class="cd-unit"><div class="cd-num" id="cd-days">00</div><div class="cd-label">Days</div></div>
    <div class="cd-unit"><div class="cd-num" id="cd-hours">00</div><div class="cd-label">Hours</div></div>
    <div class="cd-unit"><div class="cd-num" id="cd-mins">00</div><div class="cd-label">Minutes</div></div>
    <div class="cd-unit"><div class="cd-num" id="cd-secs">00</div><div class="cd-label">Seconds</div></div>
  </div>
</div>

<!-- INTRO CUE over heart -->
<div id="intro-cue">
  <div class="for-someone">For someone very special.</div>
  <div class="scroll-cta">Scroll to begin</div>
  <div class="scroll-arrow">↓</div>
</div>

<!-- SCROLL STORY (spacers driving the 3D world) -->
<div id="story">
  <div class="act" id="act-heart"></div>
  <div class="act" id="act-memories"></div>
  <div class="act" id="act-envelope"></div>
  <div class="act" id="act-letter"></div>
  <div class="act" id="act-universe"></div>
  <div class="act" id="act-final"></div>
</div>

<!-- LETTER OVERLAY -->
<div id="letter-wrap">
  <div class="letter-paper">
    <button class="letter-close" type="button" onclick="window.__closeLetterCard && window.__closeLetterCard()" title="Close">✕</button>
    <div class="letter-dear">Dear Bia,</div>
    <div class="letter-body" id="letter-body"></div>
    <div class="letter-scroll-hint">keep scrolling when you're ready</div>
  </div>
</div>

<!-- FINAL OVERLAY -->
<div id="final-wrap">
  <div class="final-line"></div>
  <div class="final-line"></div>
  <div class="final-line"></div>
  <div class="final-line"></div>
</div>

<button id="music-btn" title="music">♪</button>
<div id="rail"><div id="rail-fill"></div></div>
<audio id="bg-audio" loop preload="none"></audio>


<!-- ======================= LIBS ======================= -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js" crossorigin="anonymous"></script>

<!-- ======================= APP ======================= -->
<script>
(function(){
"use strict";
const CFG = window.SITE_CONFIG;
const isTouch = window.matchMedia("(pointer:coarse)").matches;
const isMobile = window.innerWidth < 820 || isTouch;

/* ============================================================
   0. CUSTOM CURSOR + LOVE TRAIL
============================================================ */
(function cursorModule(){
  if(isTouch){ document.body.classList.add("no-custom-cursor"); return; }
  const dot = document.getElementById("cursorDot");
  const halo = document.getElementById("cursorHalo");
  let mx=innerWidth/2,my=innerHeight/2, hx=mx,hy=my, dx=mx,dy=my;
  window.addEventListener("mousemove", e=>{ mx=e.clientX; my=e.clientY; maybeSpawnTrail(e.clientX,e.clientY); });
  function raf(){
    dx += (mx-dx)*0.35; dy += (my-dy)*0.35;
    hx += (mx-hx)*0.14; hy += (my-hy)*0.14;
    dot.style.left=dx+"px"; dot.style.top=dy+"px";
    halo.style.left=hx+"px"; halo.style.top=hy+"px";
    requestAnimationFrame(raf);
  }
  raf();

  let lastTrail=0;
  function maybeSpawnTrail(x,y){
    const now=performance.now();
    if(now-lastTrail<90) return;
    lastTrail=now;
    const kindRoll = Math.random();
    if(kindRoll<0.65){
      const p=document.createElement("div");
      p.className="trail-particle";
      const size = 3+Math.random()*4;
      p.style.width=size+"px"; p.style.height=size+"px";
      p.style.background = Math.random()<0.5 ? "#f3c9d6" : "#e6c391";
      p.style.left=x+"px"; p.style.top=y+"px";
      p.style.boxShadow="0 0 8px 2px rgba(232,163,187,.5)";
      document.body.appendChild(p);
      const ang = Math.random()*Math.PI*2, dist=14+Math.random()*20;
      gsap.to(p,{ x:Math.cos(ang)*dist, y:Math.sin(ang)*dist-18, opacity:0, duration:1+Math.random()*.6, ease:"power1.out",
        onComplete:()=>p.remove() });
    } else if(kindRoll<0.85){
      spawnHeart(x,y,10);
    } else {
      spawnPetal(x,y);
    }
  }
  function spawnHeart(x,y,size){
    const h=document.createElement("div");
    h.className="burst-heart"; h.textContent="❤";
    h.style.left=x+"px"; h.style.top=y+"px"; h.style.fontSize=size+"px"; h.style.color="#e8a3bb";
    document.body.appendChild(h);
    gsap.to(h,{ y:"-=26", opacity:0, rotate:(Math.random()*40-20), duration:1.1, ease:"power1.out", onComplete:()=>h.remove() });
  }
  function spawnPetal(x,y){
    const p=document.createElement("div");
    p.className="trail-particle";
    p.style.width="8px"; p.style.height="5px"; p.style.borderRadius="60% 40% 60% 40%";
    p.style.background="linear-gradient(135deg,#f7d8e2,#c98aa0)";
    p.style.left=x+"px"; p.style.top=y+"px";
    document.body.appendChild(p);
    gsap.to(p,{ y:"+=22", x:"+="+(Math.random()*30-15), rotate:180*Math.random(), opacity:0, duration:1.4, ease:"power1.out", onComplete:()=>p.remove() });
  }
  window.__loveClickBurst = function(x,y){
    const count = 5+Math.floor(Math.random()*7);
    for(let i=0;i<count;i++){
      setTimeout(()=>spawnHeart(x+(Math.random()*20-10), y+(Math.random()*20-10), 10+Math.random()*8), i*30);
    }
    for(let i=0;i<3;i++) setTimeout(()=>spawnPetal(x,y), i*50);
  };
  document.addEventListener("click", e=>window.__loveClickBurst(e.clientX,e.clientY));

  document.querySelectorAll("[data-cursor]").forEach(el=>{
    el.addEventListener("mouseenter", ()=>halo.classList.add(el.dataset.cursor==="heart"?"hover-heart":"hover-soft"));
    el.addEventListener("mouseleave", ()=>halo.classList.remove("hover-heart","hover-soft"));
  });
})();

/* password submit is handled by the minimal dependency-free script in <head>/<body> top,
   which calls window.__unlockUI() on success. Wrong-password shake is handled there too. */
window.__unlockUI = function(){
  if(passwordScreen.style.display === "none") return; // already unlocked
  grantedText.classList.add("show");
  if(window.__loveClickBurst) window.__loveClickBurst(innerWidth/2, innerHeight/2);
  setTimeout(()=>{
    passwordScreen.style.opacity = "0";
    setTimeout(()=>{ passwordScreen.style.display="none"; enterCountdown(); }, 1400);
  }, 900);
};
function getTargetDate(){
  const { year, month, day } = CFG.target;
  return new Date(year, month-1, day, 0,0,0,0);
}
let countdownInterval = null;
function enterCountdown(){
  const target = getTargetDate();
  const now = new Date();
  if(now.getTime() >= target.getTime()){
    startMainExperience();
    return;
  }
  countdownScreen.classList.add("active");
  tickCountdown();
  countdownInterval = setInterval(tickCountdown, 1000);
}
function tickCountdown(){
  const target = getTargetDate();
  const now = new Date();
  const diff = target.getTime() - now.getTime();
  if(diff <= 0){
    clearInterval(countdownInterval);
    countdownCompleteTransition();
    return;
  }
  const d = Math.floor(diff/86400000);
  const h = Math.floor((diff%86400000)/3600000);
  const m = Math.floor((diff%3600000)/60000);
  const s = Math.floor((diff%60000)/1000);
  document.getElementById("cd-days").textContent = String(d).padStart(2,"0");
  document.getElementById("cd-hours").textContent = String(h).padStart(2,"0");
  document.getElementById("cd-mins").textContent = String(m).padStart(2,"0");
  document.getElementById("cd-secs").textContent = String(s).padStart(2,"0");
}
function countdownCompleteTransition(){
  countdownScreen.style.opacity = "0";
  setTimeout(()=>{
    countdownScreen.style.display="none";
    startMainExperience();
  }, 1300);
}

window.doSkipCountdown = function(){
  clearInterval(countdownInterval);
  countdownCompleteTransition();
};

function startMainExperience(){
  document.body.style.overflowY = "auto";
  introCue.classList.add("show");
  musicBtn.classList.add("show");
  rail.classList.add("show");
  if(window.__scrollTriggerReady){
    window.__scrollTriggerReady();
  } else {
    // 3D world not ready yet (still loading) or failed — poll briefly, else fall back to simple scroll
    let tries = 0;
    const poll = setInterval(()=>{
      tries++;
      if(window.__scrollTriggerReady){ clearInterval(poll); window.__scrollTriggerReady(); }
      else if(tries>40){ clearInterval(poll); }
    }, 100);
  }
}

   2. MOUSE PARALLAX (subtle, affects heart + universe)
============================================================ */
let mouseNX=0, mouseNY=0, mouseTX=0, mouseTY=0;
window.addEventListener("mousemove", e=>{
  mouseTX = (e.clientX/innerWidth - 0.5)*2;
  mouseTY = (e.clientY/innerHeight - 0.5)*2;
});
window.addEventListener("touchmove", e=>{
  if(!e.touches || !e.touches[0]) return;
  mouseTX = (e.touches[0].clientX/innerWidth - 0.5)*2;
  mouseTY = (e.touches[0].clientY/innerHeight - 0.5)*2;
}, {passive:true});

/* ============================================================
   3. SCROLL PROGRESS -> CAMERA / SCENE STATE
============================================================ */
let currentAct = "heart";

const ACTS = [
  { id:"heart",     start:0.00, end:0.14 },
  { id:"memories",  start:0.14, end:0.50 },
  { id:"envelope",  start:0.50, end:0.60 },
  { id:"letter",    start:0.60, end:0.74 },
  { id:"universe",  start:0.74, end:0.92 },
  { id:"final",     start:0.92, end:1.00 }
];
function actLocal(id){
  const a = ACTS.find(x=>x.id===id);
  const t = THREE.MathUtils.clamp((progress-a.start)/(a.end-a.start), 0, 1);
  return t;
}
function inAct(id){ const a=ACTS.find(x=>x.id===id); return progress>=a.start && progress<=a.end; }

const letterWrap = document.getElementById("letter-wrap");
const finalWrap = document.getElementById("final-wrap");
const finalLinesEls = document.querySelectorAll(".final-line");
CFG.finalLines.forEach((t,i)=>{ if(finalLinesEls[i]) finalLinesEls[i].textContent = t; });
document.getElementById("letter-body").textContent = CFG.letter;
const introCue = document.getElementById("intro-cue");
const rail = document.getElementById("rail");
const railFill = document.getElementById("rail-fill");

let finalTriggered = false;
let letterDismissed = false;
window.__closeLetterCard = function(){
  letterDismissed = true;
  letterWrap.classList.remove("show");
  const storyEl = document.getElementById("story");
  const total = storyEl.offsetHeight - window.innerHeight;
  const targetProgress = ACTS.find(a=>a.id==="universe").start + 0.02;
  window.scrollTo({ top: Math.max(0, total*targetProgress), behavior:"smooth" });
};

function updateSceneFromProgress(){
  railFill.style.height = (progress*100).toFixed(1)+"%";

  // ---------- HEART ACT ----------
  if(progress < ACTS[1].start + 0.03){
    const t = actLocal("heart");
    const camZ = THREE.MathUtils.lerp(9, 1.2, t);
    camera.position.x = THREE.MathUtils.lerp(0,0,t) + mouseNX*0.4;
    camera.position.y = mouseNY*0.25;
    camera.position.z = camZ;
    camera.lookAt(heart.position.x, heart.position.y, heart.position.z);
    heart.scale.setScalar(THREE.MathUtils.lerp(0.9,1.15,t));
    heart.visible = true;
  } else {
    heart.visible = progress < ACTS[1].start + 0.08;
  }

  // ---------- MEMORIES ACT ----------
  if(inAct("memories")){
    const t = actLocal("memories");
    const camPos = memCurve.getPointAt(THREE.MathUtils.clamp(t,0,0.995));
    const lookPos = memCurve.getPointAt(THREE.MathUtils.clamp(t+0.02,0,1));
    camera.position.set(camPos.x + mouseNX*0.3, camPos.y + mouseNY*0.2, camPos.z);
    camera.lookAt(lookPos.x, lookPos.y, lookPos.z);
  } else if(progress > ACTS[1].end){
    // keep camera continuing near end of curve when moving to envelope
  }

  // caption tags fade near their polaroid (index-based on memories progress)
  const memT = actLocal("memories");
  polaroidGroups.forEach((g,i)=>{
    const target = (i+0.5)/polaroidGroups.length;
    const dist = Math.abs(memT-target);
    const el = document.querySelectorAll(".pg-caption")[i];
  });

  // ---------- ENVELOPE ACT ----------
  if(progress >= ACTS[1].end - 0.02 && progress <= ACTS[2].end + 0.02){
    const t = actLocal("envelope");
    const camZ = THREE.MathUtils.lerp(memEnd.z-2, envZ+2.6, THREE.MathUtils.clamp((progress-(ACTS[1].end-0.02))/(ACTS[2].end-(ACTS[1].end-0.02)),0,1));
    camera.position.set(mouseNX*0.15, 0.15+mouseNY*0.1, camZ);
    camera.lookAt(0,0,envZ);
    const openT = THREE.MathUtils.clamp((t-0.35)/0.5,0,1);
    flap.rotation.x = -openT * 2.35;
    goldSeal.visible = openT < 0.15;
    letterMesh.visible = openT > 0.55;
    if(letterMesh.visible){
      letterMesh.position.z = envZ + 0.15 + (openT-0.55)*3.2;
      letterMesh.position.y = (openT-0.55)*0.6;
      letterMesh.material.opacity = 1;
    }
  }

  // ---------- LETTER ACT ----------
  if(inAct("letter") && !letterDismissed){
    const t = actLocal("letter");
    camera.position.set(mouseNX*0.1, 0.2+mouseNY*0.08, envZ + 0.6 - t*1.4);
    camera.lookAt(0,0.1,envZ+2);
    letterWrap.classList.add("show");
    letterMesh.visible = false;
  } else {
    letterWrap.classList.remove("show");
    if(!inAct("letter")) letterDismissed = false; // reset once scrolled fully out, in case user scrolls back up later
  }

  // ---------- UNIVERSE ACT ----------
  if(inAct("universe") || (progress>ACTS[3].end && progress<ACTS[4].end+0.02)){
    const t = actLocal("universe");
    const ang = THREE.MathUtils.lerp(-0.6, Math.PI*1.15, t);
    const radius = THREE.MathUtils.lerp(6.5, 4.2, Math.min(t*2,1));
    camera.position.set(
      portraitGroup.position.x + Math.sin(ang)*radius + mouseNX*0.3,
      portraitGroup.position.y + Math.sin(t*Math.PI)*0.6 + mouseNY*0.2,
      portraitGroup.position.z + Math.cos(ang)*radius
    );
    camera.lookAt(portraitGroup.position);
    portraitGroup.rotation.y = Math.sin(t*Math.PI)*0.15;
  }

  // ---------- FINAL ACT ----------
  if(inAct("final")){
    const t = actLocal("final");
    camera.position.set(
      THREE.MathUtils.lerp(camera.position.x, finalAnchor.x, 0.06),
      THREE.MathUtils.lerp(0.3, 0.5, t),
      THREE.MathUtils.lerp(portraitGroup.position.z+4.2, finalAnchor.z, t)
    );
    camera.lookAt(finalAnchor.x, 0.3, finalAnchor.z-3);
    finalWrap.classList.add("show");
    if(!finalTriggered && t>0.12){
      finalTriggered = true;
      finalLinesEls.forEach((el,i)=>{
        gsap.delayedCall(0.4+i*0.7, ()=>el.classList.add("reveal"));
      });
    }
  } else {
    finalWrap.classList.remove("show");
  }

  currentAct = ACTS.find(a=>progress>=a.start && progress<=a.end)?.id || currentAct;
}

/* ============================================================
   4. RENDER LOOP
============================================================ */
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  mouseNX += (mouseTX-mouseNX)*0.05;
  mouseNY += (mouseTY-mouseNY)*0.05;

  updatePetals(t);
  heart.rotation.y = t*0.25 + mouseNX*0.4;
  heart.rotation.x = Math.sin(t*0.5)*0.05 + mouseNY*0.15;
  heart.position.y = Math.sin(t*0.8)*0.08;
  heartGlow.position.copy(heart.position);
  updateOrbit(t, 1);

  loveTextData.forEach(d=>{
    d.a += d.speed*0.01;
    d.spr.position.set(Math.cos(d.a)*d.r, d.y+Math.sin(t*0.4+d.a)*0.2, Math.sin(d.a)*d.r);
    d.spr.material.rotation = Math.sin(t*0.2)*0.02;
  });
  orbitFlowerData.forEach(d=>{
    d.a += d.speed*0.01;
    d.f.position.set(Math.cos(d.a)*d.r, d.y, Math.sin(d.a)*d.r);
    d.f.rotation.y += 0.01;
  });
  distantFlowers.rotation.y = t*0.01;

  polaroidGroups.forEach((g,i)=>{
    g.position.y += Math.sin(t*0.5+i)*0.0007;
    g.rotation.z += Math.sin(t*0.3+i)*0.00015;
  });

  updateSceneFromProgress();
  renderer.render(scene, camera);
}
animate();

let resizeTimer;
let lastLayoutWidth = innerWidth;
window.addEventListener("resize", ()=>{
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(()=>{
    const widthChanged = Math.abs(innerWidth - lastLayoutWidth) > 10;
    camera.aspect = innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setPixelRatio(Math.min(devicePixelRatio, (innerWidth < 820 || window.matchMedia("(pointer:coarse)").matches) ? 1.5 : 2));
    renderer.setSize(innerWidth, innerHeight);

    // Mobile browsers resize the viewport when their address bar appears/disappears.
    // Refreshing ScrollTrigger for every such height change makes the page jump while scrolling.
    if(!isTouch || widthChanged){
      lastLayoutWidth = innerWidth;
      if(ScrollTrigger && ScrollTrigger.refresh) ScrollTrigger.refresh();
    }
  }, 120);
});

if(window.visualViewport){
  window.visualViewport.addEventListener("resize", ()=>{
    if(!isTouch) return;
    camera.aspect = innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight, false);
  }, {passive:true});
}

/* expose the scroll-driven story to the gate logic defined earlier */
window.__scrollTriggerReady = function(){
  gsap.registerPlugin(ScrollTrigger);
  ScrollTrigger.create({
    trigger: "#story",
    start: "top top",
    end: "bottom bottom",
    scrub: 0.6,
    onUpdate: self => {
      progress = self.progress;
      if(progress > 0.02) introCue.classList.remove("show");
    }
  });
};

} catch(err){
  console.error("3D world failed to initialize, continuing without it:", err);
  window.__closeLetterCard = function(){
    window.__letterDismissedFallback = true;
    document.getElementById("letter-wrap").classList.remove("show");
    const storyEl = document.getElementById("story");
    const total = storyEl.offsetHeight - window.innerHeight;
    window.scrollTo({ top: Math.max(0, total*0.76), behavior:"smooth" });
  };
  // Fallback so the site still "works" (scrolls, shows overlays) even if WebGL/3D failed.
  window.__scrollTriggerReady = function(){
    if(typeof gsap !== "undefined" && typeof ScrollTrigger !== "undefined"){
      gsap.registerPlugin(ScrollTrigger);
      ScrollTrigger.create({
        trigger: "#story", start: "top top", end: "bottom bottom", scrub: 0.6,
        onUpdate: self => {
          progress = self.progress;
          if(progress > 0.02) introCue.classList.remove("show");
          const letterWrap = document.getElementById("letter-wrap");
          const finalWrap = document.getElementById("final-wrap");
          if(progress>0.60 && progress<0.74 && !window.__letterDismissedFallback) letterWrap.classList.add("show"); else letterWrap.classList.remove("show");
          if(progress>0.92){
            finalWrap.classList.add("show");
            document.querySelectorAll(".final-line").forEach(el=>el.classList.add("reveal"));
          } else finalWrap.classList.remove("show");
        }
      });
    }
  };
}

})();
</script>
